<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    
    <!-- Apple Gradient (Metallic Grey) -->
    <linearGradient id="apple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7"/> <!-- zinc-200 -->
      <stop offset="100%" stop-color="#52525b"/> <!-- zinc-600 -->
    </linearGradient>
    
    <!-- Leaf Gradient (Silver Grey) -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/> <!-- zinc-100 -->
      <stop offset="100%" stop-color="#71717a"/> <!-- zinc-500 -->
    </linearGradient>

    <!-- Laser Glow Filter -->
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" stroke="#27272a" stroke-width="6"/>

  <!-- Inner Border for modern depth -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Apple & Scan Pattern Group -->
  <g transform="translate(106, 60)">
    <!-- Apple Leaf (Centered directly above the apple dip) -->
    <path d="M84 40 C114 42 139 62 149 87 C123 89 98 71 88 46 Z" fill="url(#leaf-grad)" />
    
    <!-- Apple Body -->
    <path d="M174 100 
             C142 100 110 118 94 118 
             C78 118 51 103 26 103 
             C-10 103 -39 132 -39 194 
             C-39 254 0 363 36 363 
             C54 363 65 352 86 352 
             C107 352 117 363 136 363 
             C172 363 207 254 207 194 
             C207 132 178 100 174 100 Z" 
          fill="url(#apple-grad)" />
          
    <!-- Stylized Barcode stripes masked on the apple -->
    <g opacity="0.16">
      <rect x="-10" y="110" width="8" height="240" fill="#000" />
      <rect x="6" y="110" width="5" height="240" fill="#000" />
      <rect x="23" y="110" width="14" height="240" fill="#000" />
      <rect x="48" y="110" width="7" height="240" fill="#000" />
      <rect x="65" y="110" width="3" height="240" fill="#000" />
      <rect x="78" y="110" width="18" height="240" fill="#000" />
      <rect x="108" y="110" width="10" height="240" fill="#000" />
      <rect x="125" y="110" width="5" height="240" fill="#000" />
      <rect x="138" y="110" width="13" height="240" fill="#000" />
      <rect x="159" y="110" width="7" height="240" fill="#000" />
      <rect x="176" y="110" width="10" height="240" fill="#000" />
    </g>
  </g>

  <!-- Scanner Target Corners (Thin glowing tech border) -->
  <g stroke="#34d399" stroke-width="4" fill="none" opacity="0.5">
    <!-- Top Left -->
    <path d="M 90,130 L 90,90 L 130,90" />
    <!-- Top Right -->
    <path d="M 422,130 L 422,90 L 382,90" />
    <!-- Bottom Left -->
    <path d="M 90,382 L 90,422 L 130,422" />
    <!-- Bottom Right -->
    <path d="M 422,382 L 422,422 L 382,422" />
  </g>

  <!-- Glowing Laser Scanning Line -->
  <line x1="70" y1="265" x2="442" y2="265" stroke="#34d399" stroke-width="6" stroke-linecap="round" filter="url(#laser-glow)" />
  <line x1="70" y1="265" x2="442" y2="265" stroke="#e6fffa" stroke-width="2" stroke-linecap="round" />
</svg>