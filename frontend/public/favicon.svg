<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep dark-theme radial background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18181b"/> <!-- zinc-900 -->
      <stop offset="100%" stop-color="#09090b"/> <!-- zinc-950 -->
    </radialGradient>
    
    <!-- Neon Theme Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/> <!-- Purple -->
      <stop offset="50%" stop-color="#6366f1"/> <!-- Indigo -->
      <stop offset="100%" stop-color="#3b82f6"/> <!-- Blue -->
    </linearGradient>
    
    <!-- Leaf Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/> <!-- Emerald -->
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#27272a" stroke-width="4"/>
  
  <!-- Tech Inner Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Glowing Shield / Target Badge -->
  <path d="M256 90 
           L386 165 
           V315 
           L256 390 
           L126 315 
           V165 Z" 
        fill="none" 
        stroke="url(#neon-grad)" 
        stroke-width="10" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Stylized Fork and Spoon inside the shield -->
  <g transform="translate(186, 170)">
    <!-- Fork -->
    <path d="M20 10 
             V70 
             C20 85 40 85 40 70 
             V10" 
          fill="none" 
          stroke="url(#neon-grad)" 
          stroke-width="6" 
          stroke-linecap="round" />
    <line x1="30" y1="10" x2="30" y2="50" stroke="url(#neon-grad)" stroke-width="6" stroke-linecap="round" />
    <path d="M30 80 V130" stroke="url(#neon-grad)" stroke-width="8" stroke-linecap="round" />

    <!-- Spoon -->
    <path d="M100 10 
             C80 10 70 35 70 55 
             C70 75 85 85 100 85 
             C115 85 130 75 130 55 
             C130 35 120 10 100 10 Z" 
          fill="url(#neon-grad)" opacity="0.15" />
    <path d="M100 10 
             C80 10 70 35 70 55 
             C70 75 85 85 100 85 
             C115 85 130 75 130 55 
             C130 35 120 10 100 10" 
          fill="none" 
          stroke="url(#neon-grad)" 
          stroke-width="6" 
          stroke-linejoin="round" />
    <path d="M100 85 V130" stroke="url(#neon-grad)" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Floating Glowing Emerald Leaf (Diet/Nutrition aspect) -->
  <path d="M256 120 C290 120 310 145 315 175 C285 177 260 155 256 120 Z" 
        fill="url(#accent-grad)" 
        filter="url(#glow)" />
        
  <!-- Decorative scanning crosshairs at the corners -->
  <g stroke="#a855f7" stroke-width="3" opacity="0.4">
    <line x1="60" y1="60" x2="90" y2="60" />
    <line x1="60" y1="60" x2="60" y2="90" />
    
    <line x1="452" y1="60" x2="422" y2="60" />
    <line x1="452" y1="60" x2="452" y2="90" />
    
    <line x1="60" y1="452" x2="90" y2="452" />
    <line x1="60" y1="452" x2="60" y2="422" />
    
    <line x1="452" y1="452" x2="422" y2="452" />
    <line x1="452" y1="452" x2="452" y2="422" />
  </g>
</svg>